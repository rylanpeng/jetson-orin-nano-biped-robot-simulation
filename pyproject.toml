[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jetson-orin-nano-biped-robot-simulation"
version = "0.1.0"
description = "Jetson Orin Nano Biped Robot Simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "genesis-world==0.4.0",
    "torch",
    "numpy>=1.26.4,<2",
    "tensordict>=0.10.0",
    "tensorboard>=2.20.0",
    "pynput>=1.8.1",
    "setuptools==81.0.0",
    "matplotlib>=3.10.8",
    "torch-tb-profiler>=0.4.3",
]

[tool.setuptools]
packages = ["rl"]

[tool.uv.sources]
torch = { url = "https://developer.download.nvidia.com/compute/redist/jp/v61/pytorch/torch-2.5.0a0+872d972e41.nv24.08.17622132-cp310-cp310-linux_aarch64.whl" }
